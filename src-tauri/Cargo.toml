[package]
name = "putrefactory-timer"
version = "0.1.0"
description = "Overlay de timer para hunts de Putrefactory"
authors = ["Putrefactory Timer contributors"]
edition = "2021"
[lib]
name = "putrefactory_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
